<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <script defer src="models/drawable-object.js"></script>
    <script defer src="./models/movable-object.class.js"></script>
    <script defer src="./models/character.class.js"></script>
    <script defer src="./models/chicken.class.js"></script>
    <script defer src="./models/chicken-small.class.js"></script>
    <script defer src="./models/cloud.class.js"></script>
    <script defer src="./models/status-bar.class.js"></script>
    <script defer src="./models/keyboard.class.js"></script>
    <script defer src="./models/level.class.js"></script>
    <script defer src="./models/background-object.class.js"></script>
    <script defer src="./models/endboss.class.js"></script>
    <script defer src="./models/coin.class.js"></script>
    <script defer src="./models/coin-bar.class.js"></script>
    <script defer src="./models/bottle.class.js"></script>
    <script defer src="./models/bottle-bar.class.js"></script>
    <script defer src="./models/endboss-bar.class.js"></script>
    <script defer src="./levels/level1.js"></script>
    <script defer src="./models/throwable-object.class.js"></script>
    <script defer src="./models/world.class.js"></script>
    <script defer src="./models/audio-hub-class.js"></script>
    <script defer src="./js/game.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="img/button icons/favicon el pollo loco.png">
</head>

<body onload="init()">
    <h1>El Pollo loco</h1>
    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="menu-controls">
            <div id="infoBtn" onclick="openControls()">
                <div class="info-icon">?</div>
            </div>
            <div id="muteBtn" onclick="toggleMute()">
                <img src="img/button icons/volume-high-svgrepo-com.svg" id="muteIcon" alt="Mute">
            </div>
            <div id="fullscreenBtn" onclick="toggleFullscreen()">
                <img src="img/button icons/fullscreen.svg" alt="Fullscreen">
            </div>
        </div>

        <div id="startScreen" class="overlay">
            <div class="start-content">
                <button onclick="startGame()">Spiel starten</button>
            </div>
        </div>

        <div id="controlsScreen" class="overlay d-none">
            <div class="controls-content">
                <h2>Steuerung</h2>
                <div class="controls-grid">
                    <p><b>Pfeiltasten Links/Rechts:</b> Bewegen</p>
                    <p><b>Leertaste:</b> Springen</p>
                    <p><b>D:</b> Flasche werfen</p>
                </div>
                <p>Springe auf Gegner, um sie zu besiegen!</p>
                <button onclick="closeControls()">Schließen</button>
            </div>
        </div>

        <div id="pauseScreen" class="overlay d-none">
            <div class="pause-content">
                <h1>PAUSE</h1>
                <button onclick="togglePause()">Weiter</button>
                <button onclick="backToMenu()">Hauptmenü</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay d-none">
            <div class="result-buttons">
                <button class="btn-restart" onclick="restartGame()">Neustart</button>
                <button class="btn-home" onclick="backToMenu()">Hauptmenü</button>
            </div>
        </div>

        <div id="winScreen" class="overlay d-none">
            <div class="result-buttons">
                <button class="btn-restart" onclick="restartGame()">Neustart</button>
                <button class="btn-home" onclick="backToMenu()">Hauptmenü</button>
            </div>
        </div>

        <div id="gameUI" class="d-none">
            <div class="top-controls">
                <div id="pauseBtn" onclick="togglePause()">
                    <div class="pause-icon"></div>
                </div>
            </div>

            <div class="mobile-controls">
                <div class="mobile-controls-left">
                    <div id="btnLeft" class="mobile-btn" onmousedown="mobileKeyPress('LEFT')"
                        onmouseup="mobileKeyRelease('LEFT')" onmouseleave="mobileKeyRelease('LEFT')"
                        ontouchstart="if(event.cancelable) event.preventDefault(); mobileKeyPress('LEFT')"
                        ontouchend="if(event.cancelable) event.preventDefault(); mobileKeyRelease('LEFT')"
                        ontouchcancel="if(event.cancelable) event.preventDefault(); mobileKeyRelease('LEFT')">
                        <img src="img/button icons/arrow-left.svg" alt="Left">
                    </div>
                    <div id="btnRight" class="mobile-btn" onmousedown="mobileKeyPress('RIGHT')"
                        onmouseup="mobileKeyRelease('RIGHT')" onmouseleave="mobileKeyRelease('RIGHT')"
                        ontouchstart="if(event.cancelable) event.preventDefault(); mobileKeyPress('RIGHT')"
                        ontouchend="if(event.cancelable) event.preventDefault(); mobileKeyRelease('RIGHT')"
                        ontouchcancel="if(event.cancelable) event.preventDefault(); mobileKeyRelease('RIGHT')">
                        <img src="img/button icons/arrow-right.svg" alt="Right">
                    </div>
                </div>
                <div class="mobile-controls-right">
                    <div id="btnJump" class="mobile-btn" onmousedown="mobileKeyPress('SPACE')"
                        onmouseup="mobileKeyRelease('SPACE')" onmouseleave="mobileKeyRelease('SPACE')"
                        ontouchstart="if(event.cancelable) event.preventDefault(); mobileKeyPress('SPACE')"
                        ontouchend="if(event.cancelable) event.preventDefault(); mobileKeyRelease('SPACE')"
                        ontouchcancel="if(event.cancelable) event.preventDefault(); mobileKeyRelease('SPACE')">
                        <img src="img/button icons/arrow-up.svg" alt="Jump">
                    </div>
                    <div id="btnThrow" class="mobile-btn" onmousedown="mobileKeyPress('D')"
                        onmouseup="mobileKeyRelease('D')" onmouseleave="mobileKeyRelease('D')"
                        ontouchstart="if(event.cancelable) event.preventDefault(); mobileKeyPress('D')"
                        ontouchend="if(event.cancelable) event.preventDefault(); mobileKeyRelease('D')"
                        ontouchcancel="if(event.cancelable) event.preventDefault(); mobileKeyRelease('D')">
                        <img src="img/button icons/bottle-glass-throw.svg" alt="Throw">
                    </div>
                </div>
            </div>
        </div>

        <div id="turnDeviceOverlay" class="overlay d-none">
            <div class="turn-device-content">
                <h2>Bitte drehe dein Gerät</h2>
            </div>
        </div>
        <a href="impressum.html" class="impressum-link" id="impressumBtn">Impressum</a>
    </div>
</body>

</html>
