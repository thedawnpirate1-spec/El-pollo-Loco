<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="models/drawable-object.js"></script>
    <script defer src="./models/movable-object.class.js"></script>
    <script defer src="./models/character.class.js"></script>
    <script defer src="./models/chicken.class.js"></script>
    <script defer src="./models/cloud.class.js"></script>
    <script defer src="./models/status-bar.class.js"></script>
    <script defer src="./models/keyboard.class.js"></script>
    <script defer src="./models/level.class.js"></script>
    <script defer src="./models/background-object.class.js"></script>
    <script defer src="./models/endboss.class.js"></script>
    <script defer src="./models/coin.class.js"></script>
    <script defer src="./models/coin-bar.class.js"></script>
    <script defer src="./models/bottle.class.js"></script>
    <script defer src="./models/bottle-bar.class.js"></script>
    <script defer src="./levels/level1.js"></script>
    <script defer src="./models/throwable-object.class.js"></script>
    <script defer src="./models/world.class.js"></script>
    <script defer src="./js/game.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="init()">
    <h1>El Pollo loco</h1>
    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        
        <!-- Start Screen -->
        <div id="startScreen" class="overlay" style="background-image: url('img/9_intro_outro_screens/start/startscreen_1.png');">
            <div class="content">
                <h2>Steuerung</h2>
                <p><b>Pfeiltasten Links/Rechts:</b> Bewegen</p>
                <p><b>Leertaste:</b> Springen</p>
                <p><b>D:</b> Flasche werfen</p>
                <p>Springe auf Gegner, um sie zu besiegen!</p>
                <button onclick="startGame()">Spiel starten</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay d-none" style="background-image: url('img/9_intro_outro_screens/game_over/game over!.png');">
            <div class="content">
                <button onclick="restartGame()">Erneut versuchen</button>
            </div>
        </div>
        
        <!-- Win Screen -->
        <div id="winScreen" class="overlay d-none" style="background-color: rgba(0,0,0,0.8);">
            <div class="content">
                <h1 style="color: white; font-size: 40px; text-shadow: 2px 2px 0px black;">GEWONNEN!</h1>
                <p style="color: white; font-size: 20px;">Du hast Señora Gallina besiegt!</p>
                <button onclick="restartGame()">Erneut spielen</button>
            </div>
        </div>
    </div>

</html>
