<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>El Pollo Loco ULTIMATE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; background: #000; }

  /* ===================================================================
     Rotation gate — fullscreen portrait overlay, pure-CSS animation.
     Shown only on touch devices held in portrait; fades out in landscape.
     =================================================================== */
  #rotateOverlay {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 24px;
    color: #fff;
    background: radial-gradient(circle at 50% 40%, #3a2a00 0%, #000 75%);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .45s ease, visibility 0s linear .45s;
  }
  #rotateOverlay.is-visible {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .45s ease, visibility 0s;
  }
  #rotateOverlay h2 { font-size: clamp(20px, 6vw, 34px); color: #ff9900; }
  #rotateOverlay p  { font-size: clamp(13px, 3.6vw, 18px); opacity: .85; max-width: 80vw; }
  .rotate-stage {
    position: relative; width: clamp(90px,28vmin,160px); height: clamp(90px,28vmin,160px);
    display: flex; align-items: center; justify-content: center;
  }
  .rotate-phone {
    width: clamp(48px,15vmin,84px); height: clamp(86px,27vmin,150px);
    border: 4px solid #ff9900; border-radius: 14px;
    background: rgba(255,153,0,.12); box-shadow: 0 0 22px rgba(255,153,0,.45);
    display: flex; align-items: center; justify-content: center;
    transform-origin: 50% 50%; animation: rotPhone 2.6s ease-in-out infinite;
  }
  .rotate-phone .notch {
    position: absolute; top: 8px; width: 26%; height: 4px; border-radius: 4px;
    background: #ff9900; opacity: .8;
  }
  .rotate-chicken { font-size: clamp(24px,9vmin,46px); animation: rotChick 2.6s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .rotate-arrow {
    position: absolute; width: clamp(70px,22vmin,130px); height: clamp(70px,22vmin,130px);
    border: 4px solid transparent; border-top-color: rgba(255,153,0,.85);
    border-right-color: rgba(255,153,0,.85); border-radius: 50%;
    animation: rotArrow 2.6s ease-in-out infinite;
  }
  @keyframes rotPhone { 0%,18%{transform:rotate(0)} 50%,78%{transform:rotate(-90deg)} 96%,100%{transform:rotate(-90deg)} }
  @keyframes rotChick { 0%,18%{transform:rotate(0) scale(1)} 50%,78%{transform:rotate(90deg) scale(1.08)} 96%,100%{transform:rotate(90deg) scale(1)} }
  @keyframes rotArrow { 0%,18%{transform:rotate(0);opacity:.4} 50%{transform:rotate(-90deg);opacity:1} 78%,100%{transform:rotate(-90deg);opacity:.4} }
  @media (prefers-reduced-motion: reduce) {
    .rotate-phone,.rotate-chicken,.rotate-arrow { animation-duration: .001s; animation-iteration-count: 1; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Rotation gate: shown on touch devices in portrait (see MobileGate) -->
<div id="rotateOverlay" aria-hidden="true" role="dialog" aria-label="Bitte Gerät drehen">
  <div class="rotate-stage" aria-hidden="true">
    <div class="rotate-phone"><span class="notch"></span><span class="rotate-chicken">🐔</span></div>
    <div class="rotate-arrow"></div>
  </div>
  <h2>Bitte dreh dein Gerät</h2>
  <p>El Pollo Loco ULTIMATE spielt sich am besten im Querformat.</p>
</div>

<script>
"use strict";
/**
 * @file El Pollo Loco ULTIMATE — single-file HTML5 canvas game.
 * @module ElPolloLocoUltimate
 * @description
 * A self-contained side-scrolling platformer rendered on a single canvas.
 * The world is a virtual 1280x720 (16:9) space scaled to fit any viewport with
 * letterboxing; all timings are in milliseconds and every graphic and sound is
 * generated procedurally (no external assets). Input is unified across keyboard
 * and multi-touch, and a {@link MobileGate} layer adds native-feeling mobile
 * behaviour (rotation gate, visibility pause). Wrapped in an IIFE to keep the
 * global scope clean.
 */

(function () {

/* ----------------------------- Constants -------------------------------- */
const WORLD_W = 1280;
const WORLD_H = 720;
const GRAVITY = 0.0026;          // px per ms^2 (coins, projectiles, enemies, boss)
const DT_CAP = 50;               // ms
// Player-specific tuned gravity for a responsive, satisfying jump.
const PLAYER_G_UP   = 0.0024;    // ascending (softer = higher arc)
const PLAYER_G_DOWN = 0.0046;    // descending (snappy fall)
const PLAYER_G_HANG = 0.0016;    // near apex (floaty hang time)
const PLAYER_G_CUT  = 0.0090;    // when jump released early (variable height)

const STATE = {
  MENU: "MENU", PLAYING: "PLAYING", PAUSED: "PAUSED",
  SHOP: "SHOP", GAMEOVER: "GAMEOVER", VICTORY: "VICTORY"
};

/* ----------------------------- Utilities -------------------------------- */
/**
 * Clamps a value into the inclusive range [a, b].
 * @param {number} v - Value to clamp.
 * @param {number} a - Lower bound.
 * @param {number} b - Upper bound.
 * @returns {number} The clamped value.
 */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
/**
 * Linear interpolation between a and b.
 * @param {number} a - Start value.
 * @param {number} b - End value.
 * @param {number} t - Interpolation factor (0..1).
 * @returns {number} The interpolated value.
 */
const lerp = (a, b, t) => a + (b - a) * t;
/**
 * Returns a random float in [a, b).
 * @param {number} a - Inclusive lower bound.
 * @param {number} b - Exclusive upper bound.
 * @returns {number} Random float.
 */
function rand(a, b) { return a + Math.random() * (b - a); }
/**
 * Returns a random integer in [a, b] (inclusive).
 * @param {number} a - Inclusive lower bound.
 * @param {number} b - Inclusive upper bound.
 * @returns {number} Random integer.
 */
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
/**
 * Euclidean distance between two points.
 * @param {number} ax - First point X.
 * @param {number} ay - First point Y.
 * @param {number} bx - Second point X.
 * @param {number} by - Second point Y.
 * @returns {number} The distance.
 */
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

/**
 * Axis-aligned bounding-box overlap test, with a 10% shrink on each box to
 * avoid visually-unfair false positives.
 * @param {{x:number,y:number,w:number,h:number}} a - First box.
 * @param {{x:number,y:number,w:number,h:number}} b - Second box.
 * @returns {boolean} True if the (shrunk) boxes overlap.
 */
function aabb(a, b) {
  const sx = a.w * 0.1, sy = a.h * 0.1;
  const sx2 = b.w * 0.1, sy2 = b.h * 0.1;
  return (a.x + sx) < (b.x + b.w - sx2) &&
         (a.x + a.w - sx) > (b.x + sx2) &&
         (a.y + sy) < (b.y + b.h - sy2) &&
         (a.y + a.h - sy) > (b.y + sy2);
}

/**
 * Runs a function, swallowing and logging any error so a single failure never
 * crashes the game loop.
 * @param {Function} fn - The function to execute.
 * @param {string} [label] - Optional label included in the warning on error.
 * @returns {*} The function's return value, or `undefined` if it threw.
 */
function safe(fn, label) {
  try { return fn(); }
  catch (e) { console.warn("[caught" + (label ? ":" + label : "") + "]", e); return undefined; }
}

/* ----------------------------- Storage ---------------------------------- */
/**
 * @namespace Store
 * @description Thin, crash-safe wrapper over `localStorage` namespaced with an
 * `epl_` prefix and JSON (de)serialization.
 */
const Store = {
  /**
   * Reads and parses a stored value.
   * @param {string} key - Key (without the `epl_` prefix).
   * @param {*} def - Default returned when the key is missing or unreadable.
   * @returns {*} The parsed value or the default.
   */
  get(key, def) {
    return safe(() => {
      const v = localStorage.getItem("epl_" + key);
      return v === null ? def : JSON.parse(v);
    }, "store.get") ?? def;
  },
  /**
   * Serializes and stores a value.
   * @param {string} key - Key (without the `epl_` prefix).
   * @param {*} val - JSON-serializable value to persist.
   * @returns {void}
   */
  set(key, val) {
    safe(() => localStorage.setItem("epl_" + key, JSON.stringify(val)), "store.set");
  }
};

/* ----------------------------- Audio ------------------------------------ */
/**
 * @class AudioEngine
 * @classdesc Fully procedural Web Audio engine: synthesizes all sound effects
 * and a looping chiptune soundtrack from oscillators, with a master gain and a
 * separate music bus. Lazily initialized and resumed on the first user gesture
 * to comply with browser autoplay policies.
 * @property {?AudioContext} ctx - The underlying audio context (null until init).
 * @property {?GainNode} master - Master output gain.
 * @property {?GainNode} musicGain - Music bus gain.
 * @property {boolean} enabled - Whether audio is available/allowed.
 */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.enabled = true;
    this.musicTimer = 0;
    this.musicStep = 0;
    this.bpmMul = 1;
    this.musicScale = null;
    this.musicNodes = [];
  }
  /**
   * Lazily creates the AudioContext and gain graph (master + music bus).
   * Safe to call repeatedly; disables audio if the API is unavailable.
   * @returns {void}
   */
  init() {
    if (this.ctx) return;
    safe(() => {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.12;
      this.musicGain.connect(this.master);
    }, "audio.init");
  }
  /**
   * Resumes a suspended AudioContext (autoplay-policy / tab-visibility unlock).
   * @returns {void}
   * @mobile
   */
  resume() { if (this.ctx && this.ctx.state === "suspended") safe(() => this.ctx.resume(), "audio.resume"); }
  /**
   * Current audio clock time in seconds.
   * @returns {number} The context's `currentTime`, or 0 if uninitialized.
   */
  now() { return this.ctx ? this.ctx.currentTime : 0; }

  /**
   * Plays a single oscillator tone with an attack/decay envelope and optional
   * pitch slide.
   * @param {number} freq - Start frequency in Hz.
   * @param {number} dur - Duration in seconds.
   * @param {OscillatorType} [type="sine"] - Oscillator waveform.
   * @param {number} [gain=0.2] - Peak gain.
   * @param {number} [slideTo] - If set, exponentially ramps to this frequency.
   * @returns {void}
   */
  tone(freq, dur, type, gain, slideTo) {
    if (!this.enabled || !this.ctx) return;
    safe(() => {
      const t = this.now();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    }, "audio.tone");
  }
  /**
   * Plays a band-passed white-noise burst (used for impacts/explosions).
   * @param {number} dur - Duration in seconds.
   * @param {number} [gain=0.3] - Peak gain.
   * @returns {void}
   */
  noise(dur, gain) {
    if (!this.enabled || !this.ctx) return;
    safe(() => {
      const t = this.now();
      const n = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const g = this.ctx.createGain();
      g.gain.value = gain || 0.3;
      const f = this.ctx.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 1200;
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t);
    }, "audio.noise");
  }
  /** Plays the jump sound. @returns {void} */
  jump()  { this.tone(220, 0.12, "square", 0.18, 440); }
  /**
   * Plays the coin pickup blip, pitched up by the current combo.
   * @param {number} [p=0] - Combo/pitch offset.
   * @returns {void}
   */
  coin(p) { this.tone(880 + (p || 0) * 60, 0.06, "triangle", 0.18, 1320); }
  /** Plays the combo increment chime. @returns {void} */
  combo() { this.tone(660, 0.08, "triangle", 0.2, 990); }
  /** Plays the player-hurt sound. @returns {void} */
  hurt()  { this.noise(0.2, 0.35); this.tone(160, 0.18, "sawtooth", 0.2, 60); }
  /** Plays the boss projectile-fire sound. @returns {void} */
  bossShoot() { this.tone(80, 0.3, "sawtooth", 0.25, 40); }
  /** Plays the boss-hit sound. @returns {void} */
  bossHit() { this.noise(0.12, 0.25); this.tone(300, 0.1, "square", 0.2, 120); }
  /** Plays the combo-break sound. @returns {void} */
  comboBreak() { this.tone(300, 0.2, "sawtooth", 0.2, 90); }
  /** Plays the explosion sound. @returns {void} */
  explosion() { this.noise(0.35, 0.4); this.tone(120, 0.3, "sawtooth", 0.25, 40); }
  /** Plays the power-up jingle. @returns {void} */
  powerup() { this.tone(523, 0.08, "triangle", 0.2); setTimeout(() => this.tone(784, 0.12, "triangle", 0.2), 80); }
  /** Plays the shop-purchase sound. @returns {void} */
  buy() { this.tone(440, 0.06, "square", 0.2, 660); setTimeout(() => this.tone(880, 0.1, "square", 0.2), 60); }
  /** Plays the descending game-over fanfare. @returns {void} */
  gameOver() {
    [523, 440, 349, 261].forEach((f, i) => setTimeout(() => this.tone(f, 0.3, "sawtooth", 0.22), i * 200));
  }
  /** Plays the ascending victory fanfare. @returns {void} */
  victory() {
    [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.25), i * 130));
  }
  /**
   * Selects the looping music scale for a level and resets the sequencer.
   * @param {number} level - Level number (1–3).
   * @returns {void}
   */
  setMusic(level) {
    // Level scales
    if (level === 1) this.musicScale = [261, 329, 392, 523, 392, 329];       // C major-ish, fröhlich
    else if (level === 2) this.musicScale = [261, 311, 349, 415, 349, 311];  // minor, bedrohlich
    else this.musicScale = [196, 261, 293, 349, 392, 466, 392, 293];          // episch
    this.bpmMul = 1;
    this.musicStep = 0;
    this.musicTimer = 0;
  }
  /**
   * Advances the step sequencer, emitting the next music note (and percussion
   * in high-BPM boss phases) when the beat interval elapses.
   * @param {number} dt - Elapsed time since last frame, in milliseconds.
   * @returns {void}
   */
  updateMusic(dt) {
    if (!this.enabled || !this.ctx || !this.musicScale) return;
    this.musicTimer -= dt;
    const interval = 320 / this.bpmMul;
    if (this.musicTimer <= 0) {
      this.musicTimer = interval;
      const f = this.musicScale[this.musicStep % this.musicScale.length];
      this.tone(f, interval / 1000 * 0.9, "triangle", 0.06);
      // percussion layer for phase 3 (bpmMul high)
      if (this.bpmMul >= 1.7 && this.musicStep % 2 === 0) this.noise(0.05, 0.08);
      this.musicStep++;
    }
  }
  /** Stops the music sequencer. @returns {void} */
  stopMusic() { this.musicScale = null; }
}
const Audio = new AudioEngine();

/* ----------------------------- Input ------------------------------------ */
/**
 * @namespace Input
 * @description Unified input state merging keyboard and on-canvas touch
 * buttons into a small set of high-level intents (left/right/jump/dash) plus
 * edge-triggered "pressed" flags for one-shot actions. Touch flags (`_tLeft`
 * etc.) are written by {@link Game#setupTouch}.
 */
const Input = {
  keys: {},
  left: false, right: false, jump: false, jumpPressed: false, dash: false, dashPressed: false,
  _prevJump: false, _prevDash: false,
  touchButtons: [], // filled by HUD
  /**
   * Installs keyboard listeners and unlocks audio on the first key event.
   * @param {HTMLCanvasElement} canvas - The game canvas (reserved for future use).
   * @returns {void}
   * @listens Window#keydown
   * @listens Window#keyup
   * @listens Window#blur
   */
  init(canvas) {
    window.addEventListener("keydown", (e) => {
      Audio.resume();
      this.keys[e.code] = true;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    }, { passive: false });
    window.addEventListener("keyup", (e) => { this.keys[e.code] = false; });
    window.addEventListener("blur", () => { this.keys = {}; });
  },
  /**
   * Recomputes the merged intent flags for the current frame, deriving the
   * edge-triggered `jumpPressed` / `dashPressed` from the previous frame.
   * @returns {void}
   */
  update() {
    const k = this.keys;
    const kbLeft = k["ArrowLeft"] || k["KeyA"];
    const kbRight = k["ArrowRight"] || k["KeyD"];
    const kbJump = k["ArrowUp"] || k["KeyW"] || k["Space"];
    const kbDash = k["ShiftLeft"] || k["ShiftRight"] || k["KeyK"];
    // merge keyboard + touch flags
    this.left = kbLeft || this._tLeft;
    this.right = kbRight || this._tRight;
    const jumpNow = kbJump || this._tJump;
    const dashNow = kbDash || this._tDash;
    this.jumpPressed = jumpNow && !this._prevJump;
    this.dashPressed = dashNow && !this._prevDash;
    this.jump = jumpNow;
    this.dash = dashNow;
    this._prevJump = jumpNow;
    this._prevDash = dashNow;
  },
  _tLeft: false, _tRight: false, _tJump: false, _tDash: false
};

/* ----------------------------- Particles -------------------------------- */
/**
 * @class Particle
 * @classdesc A single pooled particle (gravity, fade, colored square). Reused
 * via {@link ParticleSystem} to avoid per-frame allocation.
 */
class Particle {
  constructor() { this.active = false; }
  /**
   * Activates the particle with the given motion and appearance.
   * @param {number} x - Start X.
   * @param {number} y - Start Y.
   * @param {number} vx - Velocity X (px/ms).
   * @param {number} vy - Velocity Y (px/ms).
   * @param {number} life - Lifetime in milliseconds.
   * @param {string} color - Fill color.
   * @param {number} size - Square size in px.
   * @param {number} [gravity=0] - Downward acceleration (px/ms²).
   * @param {boolean} [fade=true] - Whether to fade/shrink over its lifetime.
   * @returns {void}
   */
  spawn(x, y, vx, vy, life, color, size, gravity, fade) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color;
    this.size = size; this.gravity = gravity || 0; this.fade = fade !== false;
    this.active = true;
  }
  /**
   * Advances the particle, deactivating it when its life expires.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) {
    if (!this.active) return;
    this.life -= dt;
    if (this.life <= 0) { this.active = false; return; }
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  /**
   * Draws the particle (alpha/size eased by remaining life when fading).
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    if (!this.active) return;
    const a = this.fade ? clamp(this.life / this.maxLife, 0, 1) : 1;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    const s = this.size * (this.fade ? (0.5 + a * 0.5) : 1);
    ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }
}
/**
 * @class ParticleSystem
 * @classdesc Fixed-size object pool of {@link Particle}s with helpers to emit
 * bursts (sparkles, debris, explosions) and to update/draw the whole pool.
 * @property {number} max - Pool capacity.
 */
class ParticleSystem {
  constructor(max) {
    this.max = max || 200;
    this.pool = [];
    for (let i = 0; i < this.max; i++) this.pool.push(new Particle());
  }
  /**
   * Emits a burst of particles from the pool.
   * @param {Object} opts - Emission options.
   * @param {number} opts.x - Origin X.
   * @param {number} opts.y - Origin Y.
   * @param {number} opts.count - Number of particles to spawn.
   * @param {number} opts.speedMin - Minimum speed (px/ms).
   * @param {number} opts.speedMax - Maximum speed (px/ms).
   * @param {number} opts.lifeMin - Minimum lifetime (ms).
   * @param {number} opts.lifeMax - Maximum lifetime (ms).
   * @param {string|function():string} opts.color - Color or color factory.
   * @param {number} opts.sizeMin - Minimum size (px).
   * @param {number} opts.sizeMax - Maximum size (px).
   * @param {number} [opts.angle] - Base emission angle; omit for full circle.
   * @param {number} [opts.spread] - Angular spread around `angle`.
   * @param {number} [opts.gravity] - Gravity applied to each particle.
   * @param {boolean} [opts.fade] - Whether particles fade out.
   * @returns {void}
   */
  emit(opts) {
    let spawned = 0;
    for (let i = 0; i < this.max && spawned < opts.count; i++) {
      if (!this.pool[i].active) {
        const ang = opts.angle != null ? opts.angle + rand(-opts.spread, opts.spread) : rand(0, Math.PI * 2);
        const spd = rand(opts.speedMin, opts.speedMax);
        this.pool[i].spawn(
          opts.x, opts.y,
          Math.cos(ang) * spd, Math.sin(ang) * spd,
          rand(opts.lifeMin, opts.lifeMax),
          typeof opts.color === "function" ? opts.color() : opts.color,
          rand(opts.sizeMin, opts.sizeMax),
          opts.gravity || 0, opts.fade
        );
        spawned++;
      }
    }
  }
  /**
   * Updates every particle in the pool.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) { for (const p of this.pool) p.update(dt); }
  /**
   * Draws every active particle.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) { for (const p of this.pool) p.draw(ctx); }
  /**
   * Deactivates all particles (e.g. on level reset).
   * @returns {void}
   */
  clear() { for (const p of this.pool) p.active = false; }
}

/* ----------------------------- Camera shake ----------------------------- */
/**
 * @namespace Shake
 * @description Global screen-shake accumulator. Effects request a duration and
 * magnitude; the renderer reads `Shake.x`/`Shake.y` each frame for a random
 * offset that decays to zero.
 */
const Shake = {
  t: 0, mag: 0,
  /**
   * Requests a shake, taking the strongest of any overlapping requests.
   * @param {number} ms - Duration in milliseconds.
   * @param {number} mag - Magnitude in pixels.
   * @returns {void}
   */
  add(ms, mag) { this.t = Math.max(this.t, ms); this.mag = Math.max(this.mag, mag); },
  /**
   * Decays the remaining shake time.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) { if (this.t > 0) { this.t -= dt; if (this.t <= 0) this.mag = 0; } },
  /** @returns {number} Random horizontal shake offset for this frame. */
  get x() { return this.t > 0 ? rand(-this.mag, this.mag) : 0; },
  /** @returns {number} Random vertical shake offset for this frame. */
  get y() { return this.t > 0 ? rand(-this.mag, this.mag) : 0; }
};

/* ----------------------------- Platform --------------------------------- */
/**
 * @class Platform
 * @classdesc A solid (optionally moving/crumbling) surface the player and
 * enemies stand on, expressed in virtual-world coordinates.
 */
class Platform {
  /**
   * @param {number} x - Left X in virtual coords.
   * @param {number} y - Top Y in virtual coords.
   * @param {number} w - Width in px.
   * @param {number} h - Height in px.
   * @param {{moving?:boolean,falling?:boolean,color?:string,color2?:string}} [opts] - Options.
   * @constructor
   */
  constructor(x, y, w, h, opts) {
    opts = opts || {};
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.baseX = x; this.baseY = y;
    this.moving = !!opts.moving;
    this.phase = rand(0, Math.PI * 2);
    this.falling = !!opts.falling;        // L2 crumbling
    this.fallTimer = -1; this.fallen = false; this.fy = 0; this.fvy = 0;
    this.color = opts.color || "#8a5a2b";
    this.edge = opts.color2 || "#6b4420";
    this.standing = false;
  }
  /** @returns {boolean} False once a crumbled platform has fallen off-screen. */
  get alive() { return !this.fallen || this.fy < WORLD_H + 200; }
  /** @returns {boolean} Whether the platform is still in play. */
  isAlive() { return this.alive; }
  /**
   * Starts the crumble countdown when a player lands on a falling platform.
   * @returns {void}
   */
  triggerFall() { if (this.falling && this.fallTimer < 0) this.fallTimer = 2000; }
  /**
   * Advances drift (moving platforms) and the crumble/fall sequence.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) {
    if (this.moving) {
      this.phase += dt * 0.0016;
      this.x = this.baseX + Math.sin(this.phase) * 18;   // gentle drift — keeps landings fair
      this.y = this.baseY + Math.sin(this.phase * 0.8) * 3;
    }
    if (this.fallTimer > 0) {
      this.fallTimer -= dt;
      if (this.fallTimer <= 0) this.fallen = true;
    }
    if (this.fallen) {
      this.fvy += GRAVITY * dt;
      this.fy += this.fvy * dt;
      this.y = this.baseY + this.fy;
    }
  }
  /**
   * Draws the platform with edge highlights and a pre-fall shake.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    const shaky = this.fallTimer > 0 && this.fallTimer < 2000;
    const ox = shaky ? rand(-1.5, 1.5) : 0;
    ctx.save();
    ctx.translate(ox, 0);
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.fillStyle = this.edge;
    ctx.fillRect(this.x, this.y, this.w, 4);
    ctx.fillRect(this.x, this.y + this.h - 4, this.w, 4);
    ctx.restore();
  }
}

/* ----------------------------- Coins ------------------------------------ */
const COIN_TYPES = {
  bronze:   { value: 1,  r: 11, color: "#cd7f32", shine: "#f0b070", rare: 0.55 },
  silver:   { value: 5,  r: 12, color: "#c0c0c0", shine: "#ffffff", rare: 0.25 },
  gold:     { value: 10, r: 13, color: "#ffd700", shine: "#fff6a0", rare: 0.14 },
  mega:     { value: 25, r: 16, color: "#ff4fd8", shine: "#ffd0f5", rare: 0.06, magnet: 150 },
  rainbow:  { value: 50, r: 15, color: "#ff0000", shine: "#ffffff", rare: 0 }
};
/**
 * Randomly selects a coin type weighted by each type's `rare` probability.
 * @returns {string} One of "bronze" | "silver" | "gold" | "mega".
 */
function pickCoinType() {
  const r = Math.random();
  let acc = 0;
  for (const k of ["bronze", "silver", "gold", "mega"]) {
    acc += COIN_TYPES[k].rare;
    if (r <= acc) return k;
  }
  return "bronze";
}
/**
 * @class Coin
 * @classdesc A collectible coin (normal or special) with idle bob animation
 * and optional magnet attraction toward the player.
 */
class Coin {
  /**
   * @param {number} x - Center X.
   * @param {number} y - Center Y.
   * @param {string} [type] - Coin type; random (weighted) when omitted.
   * @constructor
   */
  constructor(x, y, type) {
    this.type = type || pickCoinType();
    const t = COIN_TYPES[this.type];
    this.x = x; this.y = y; this.r = t.r;
    this.w = t.r * 2; this.h = t.r * 2;
    this.vx = 0; this.vy = rand(-0.2, 0.05);
    this.landed = false;
    this.collected = false;
    this.dead = false;
    this.spin = rand(0, Math.PI * 2);
    this.hue = 0;
    this.spawnScale = 0;       // grow-in animation
    this.respawnTimer = -1;
    this.flying = false;        // tween to HUD
    this.tween = 0;
    this.bobPhase = rand(0, Math.PI * 2);
  }
  /** @returns {boolean} True while the coin has not been collected/removed. */
  isAlive() { return !this.dead; }
  /** @returns {number} Center X. */
  get cx() { return this.x; }
  /** @returns {number} Center Y. */
  get cy() { return this.y; }
  /** @returns {number} AABB left edge (center minus radius). */
  get bx() { return this.x - this.r; }
  /** @returns {number} AABB top edge (center minus radius). */
  get by() { return this.y - this.r; }
  /**
   * Applies gravity and settles the coin onto a platform until it lands.
   * @param {Platform[]} platforms - Platforms to rest on.
   * @returns {void}
   */
  collide(platforms) {
    if (this.landed) return;
    const t = COIN_TYPES[this.type];
    this.vy += GRAVITY * dt0 * 1;
    this.y += this.vy * dt0;
    for (const p of platforms) {
      if (this.x > p.x && this.x < p.x + p.w &&
          this.y + this.r > p.y && this.y + this.r < p.y + p.h + 30 && this.vy > 0) {
        this.y = p.y - this.r;
        this.vy *= -0.5;
        if (Math.abs(this.vy) < 0.05) { this.vy = 0; this.landed = true; }
      }
    }
    if (this.y > WORLD_H + 100) { this.dead = true; }
  }
  /**
   * Advances spin, bob, spawn-scale, respawn timer and magnet attraction.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (for magnet/player position).
   * @returns {void}
   */
  update(dt, game) {
    this.spin += dt * 0.004;
    this.hue = (this.hue + dt * 0.4) % 360;
    this.bobPhase += dt * 0.004;
    if (this.spawnScale < 1) this.spawnScale = clamp(this.spawnScale + dt * 0.004, 0, 1);

    if (this.respawnTimer > 0) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0) {
        this.collected = false; this.spawnScale = 0;
        this.landed = false; this.vy = rand(-0.2, 0);
      }
      return;
    }
    if (this.flying) {
      this.tween += dt * 0.004;
      if (this.tween >= 1) { this.flying = false; this.dead = false; this.collected = true; }
      return;
    }
    if (this.collected) return;

    // gravity/bounce
    this.collide(game.platforms);
  }
  /**
   * Draws the coin with spin squash, type color, highlight, value pip and a
   * mega/rainbow glow.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    if (this.collected && !this.flying) return;
    const t = COIN_TYPES[this.type];
    const bob = this.landed ? Math.sin(this.bobPhase) * 2 : 0;
    const sc = this.spawnScale;
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    ctx.scale(sc, sc);
    // rotation effect: squash horizontally for spin
    const sx = Math.abs(Math.cos(this.spin)) * 0.7 + 0.3;
    ctx.scale(sx, 1);
    let col = t.color, shine = t.shine;
    if (this.type === "rainbow") {
      col = "hsl(" + this.hue + ",90%,55%)";
      shine = "hsl(" + ((this.hue + 60) % 360) + ",90%,80%)";
    }
    // body
    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = shine; ctx.stroke();
    // inner highlight
    ctx.beginPath(); ctx.arc(-this.r * 0.25, -this.r * 0.25, this.r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = shine; ctx.globalAlpha = 0.7; ctx.fill(); ctx.globalAlpha = 1;
    // value pip
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.font = "bold " + Math.round(this.r) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.type === "mega" ? "★" : (this.type === "rainbow" ? "✦" : ""), 0, 1);
    ctx.restore();
    // mega glow
    if (this.type === "mega") {
      ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(this.spin * 2) * 0.1;
      ctx.beginPath(); ctx.arc(this.x, this.y + bob, this.r * 1.8, 0, Math.PI * 2);
      ctx.fillStyle = "#ff4fd8"; ctx.fill(); ctx.restore();
    }
  }
}
/**
 * Shared per-frame delta time (ms) used by {@link Coin#collide}; updated by the
 * game each frame.
 * @type {number}
 */
let dt0 = 16;

/* ----------------------------- Projectiles ------------------------------ */
/**
 * @class Projectile
 * @classdesc A thrown salsa bottle (or boss projectile) following a ballistic
 * arc until it hits an enemy, the ground, or expires.
 */
class Projectile {
  /**
   * @param {number} x - Start X.
   * @param {number} y - Start Y.
   * @param {number} vx - Velocity X (px/ms).
   * @param {number} vy - Velocity Y (px/ms).
   * @param {{r?:number,gravity?:number,life?:number,fromBoss?:boolean,damage?:number,color?:string,feather?:boolean}} [opts] - Options.
   * @constructor
   */
  constructor(x, y, vx, vy, opts) {
    opts = opts || {};
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = opts.r || 10; this.w = this.r * 2; this.h = this.r * 2;
    this.dead = false;
    this.gravity = opts.gravity || 0;
    this.life = opts.life || 5000;
    this.fromBoss = !!opts.fromBoss;
    this.damage = opts.damage || 1;
    this.color = opts.color || "#ff7b00";
    this.feather = !!opts.feather;
  }
  /** @returns {boolean} True while the projectile is in flight. */
  isAlive() { return !this.dead; }
  /** @returns {number} AABB left edge. */
  get bx() { return this.x - this.r; }
  /** @returns {number} AABB top edge. */
  get by() { return this.y - this.r; }
  /**
   * Integrates the ballistic motion and kills the projectile on expiry or when
   * it leaves the world bounds.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (unused; kept for a uniform signature).
   * @returns {void}
   */
  update(dt, game) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // clip against walls/floor so boss can't shoot through walls
    if (this.x < -40 || this.x > WORLD_W + 40 || this.y > WORLD_H + 40 || this.y < -200) {
      this.dead = true;
    }
  }
  /**
   * Draws the projectile as a glowing orb, or a spinning feather variant.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    ctx.save();
    if (this.feather) {
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx));
      ctx.fillStyle = "#e8d8b0";
      ctx.beginPath();
      ctx.ellipse(0, 0, this.r * 1.4, this.r * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#b09060"; ctx.beginPath();
      ctx.moveTo(-this.r * 1.4, 0); ctx.lineTo(this.r * 1.4, 0); ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, this.r);
      g.addColorStop(0, "#fff3b0"); g.addColorStop(0.5, this.color); g.addColorStop(1, "rgba(255,80,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ----------------------------- Hazards ---------------------------------- */
// Lava bubble (L2), Shockwave ring (boss), Fire patch (boss), Meteor (boss), DangerZone overlay
/**
 * @class Shockwave
 * @classdesc An expanding ring hazard (boss slam) that damages the player once
 * as its radius sweeps past them.
 */
class Shockwave {
  constructor(x, y) { this.x = x; this.y = y; this.r = 10; this.maxR = 380; this.dead = false; this.hitDone = false; }
  /** @returns {boolean} True until the ring reaches its max radius. */
  isAlive() { return !this.dead; }
  /**
   * Expands the ring, killing it once it exceeds its maximum radius.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) { this.r += dt * 0.7; if (this.r > this.maxR) this.dead = true; }
  /**
   * Draws the expanding double-stroke shockwave ring (fading with radius).
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - this.r / this.maxR, 0, 1);
    ctx.strokeStyle = "#ffaa33"; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#ff5500"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
/**
 * @class FirePatch
 * @classdesc A temporary patch of ground fire that damages the player on
 * contact and fades after a fixed lifetime.
 */
class FirePatch {
  constructor(x, y, w) { this.x = x; this.y = y; this.w = w; this.h = 14; this.life = 5000; this.dead = false; }
  /** @returns {boolean} True until the fire patch burns out. */
  isAlive() { return !this.dead; }
  /**
   * Burns down the patch's lifetime and emits rising flame particles.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (particle system).
   * @returns {void}
   */
  update(dt, game) {
    this.life -= dt; if (this.life <= 0) this.dead = true;
    if (Math.random() < 0.5) game.particles.emit({
      x: this.x + rand(0, this.w), y: this.y, count: 1, angle: -Math.PI / 2, spread: 0.5,
      speedMin: 0.05, speedMax: 0.15, lifeMin: 300, lifeMax: 600,
      color: () => ["#ff3300", "#ff8800", "#ffcc00"][randi(0, 2)], sizeMin: 3, sizeMax: 7, gravity: -0.0002
    });
  }
  /**
   * Draws the fire patch, fading as it burns out.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    ctx.save(); ctx.globalAlpha = clamp(this.life / 5000, 0.2, 1);
    ctx.fillStyle = "#cc2200"; ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.restore();
  }
}
/**
 * @class LavaBubble
 * @classdesc A blob of lava that erupts upward from the ground and damages the
 * player if struck mid-arc.
 */
class LavaBubble {
  constructor(x, groundY) {
    this.x = x; this.groundY = groundY; this.y = groundY;
    this.warn = 1000; this.active = false; this.vy = -0.7;
    this.r = 18; this.w = 36; this.h = 36; this.dead = false; this.life = 1600;
  }
  /** @returns {boolean} True while the bubble is airborne. */
  isAlive() { return !this.dead; }
  /** @returns {number} AABB left edge. */
  get bx() { return this.x - this.r; }
  /** @returns {number} AABB top edge. */
  get by() { return this.y - this.r; }
  /**
   * Runs the warn telegraph, then the upward eruption arc; dies on landing or
   * lifetime expiry.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) {
    if (this.warn > 0) { this.warn -= dt; if (this.warn <= 0) this.active = true; return; }
    this.vy += GRAVITY * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.y > this.groundY + 20 || this.life <= 0) this.dead = true;
  }
  /**
   * Draws the ground warning arc during the telegraph, then the glowing blob.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    if (this.warn > 0) {
      ctx.save();
      ctx.globalAlpha = 0.4 + Math.sin(this.warn * 0.02) * 0.3;
      ctx.fillStyle = "#ff3300";
      ctx.beginPath(); ctx.arc(this.x, this.groundY, this.r * 1.1, Math.PI, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }
    const g = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.r);
    g.addColorStop(0, "#ffdd55"); g.addColorStop(0.6, "#ff6600"); g.addColorStop(1, "#cc2200");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
}
/**
 * @class Meteor
 * @classdesc A falling meteor hazard that telegraphs a target spot, then drops
 * and bursts into particles on impact.
 */
class Meteor {
  constructor(tx, groundY) {
    this.tx = tx; this.groundY = groundY;
    this.warn = 700; this.x = tx; this.y = -50; this.vy = 0; this.dead = false;
    this.r = 22; this.w = 44; this.h = 44; this.falling = false; this.exploded = false;
  }
  /** @returns {boolean} True until the meteor explodes. */
  isAlive() { return !this.dead; }
  /** @returns {number} AABB left edge. */
  get bx() { return this.x - this.r; }
  /** @returns {number} AABB top edge. */
  get by() { return this.y - this.r; }
  /**
   * Telegraphs the target, then falls and explodes (particles + shake + sound)
   * on impact.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (particles).
   * @returns {void}
   */
  update(dt, game) {
    if (this.warn > 0) { this.warn -= dt; if (this.warn <= 0) this.falling = true; return; }
    this.vy += GRAVITY * 1.6 * dt;
    this.y += this.vy * dt;
    if (this.y >= this.groundY - this.r && !this.exploded) {
      this.exploded = true; this.dead = true;
      game.particles.emit({ x: this.x, y: this.groundY, count: 18, speedMin: 0.1, speedMax: 0.4,
        lifeMin: 300, lifeMax: 700, color: () => ["#ff6600", "#ffaa00", "#999"][randi(0, 2)],
        sizeMin: 3, sizeMax: 8, gravity: 0.0006, angle: -Math.PI / 2, spread: Math.PI / 2 });
      Shake.add(250, 6);
      safe(() => Audio.explosion(), "meteor.boom");
    }
  }
  /**
   * Draws the ground target reticle during the telegraph, then the falling
   * fireball with a trail.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    if (this.warn > 0) {
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.sin(this.warn * 0.03) * 0.3;
      ctx.strokeStyle = "#ff3300"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(this.tx, this.groundY, this.r * 1.3, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,50,0,0.2)";
      ctx.beginPath(); ctx.arc(this.tx, this.groundY, this.r * 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }
    ctx.save();
    const g = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.r);
    g.addColorStop(0, "#fff"); g.addColorStop(0.5, "#ff8800"); g.addColorStop(1, "#552200");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    // trail
    ctx.globalAlpha = 0.4; ctx.fillStyle = "#ff6600";
    ctx.beginPath(); ctx.ellipse(this.x, this.y - this.r, this.r * 0.6, this.r * 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ----------------------------- Enemies ---------------------------------- */
/**
 * @class Chicken
 * @classdesc A basic walking enemy. Patrols, can be defeated by a stomp from
 * above or a thrown projectile, and damages the player on side contact.
 */
class Chicken {
  /**
   * @param {number} x - Spawn X.
   * @param {number} y - Spawn Y.
   * @param {{speed?:number,hp?:number,fire?:boolean,mini?:boolean,platform?:Platform}} [opts] - Options.
   * @constructor
   */
  constructor(x, y, opts) {
    opts = opts || {};
    this.x = x; this.y = y; this.w = 46; this.h = 42;
    this.vx = opts.speed || 0.08; this.dir = -1;
    this.hp = opts.hp || 1; this.maxHp = this.hp;
    this.dead = false; this.fire = !!opts.fire; this.mini = !!opts.mini;
    if (this.mini) { this.w = 34; this.h = 30; this.hp = 20; this.maxHp = 20; }
    this.shootTimer = rand(1500, 3000);
    this.legPhase = 0; this.flash = 0;
    this.vy = 0; this.platform = opts.platform || null;
  }
  /** @returns {boolean} True while the chicken is alive. */
  isAlive() { return !this.dead; }
  /** @returns {number} AABB left edge. */
  get bx() { return this.x; }
  /** @returns {number} AABB top edge. */
  get by() { return this.y; }
  /**
   * Applies damage; on death emits debris and drops a coin.
   * @param {number} dmg - Damage dealt.
   * @param {Game} game - The owning game (particles, coin drop).
   * @returns {void}
   */
  hurt(dmg, game) {
    this.hp -= dmg; this.flash = 120;
    safe(() => Audio.bossHit(), "chick.hit");
    game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 8,
      speedMin: 0.1, speedMax: 0.3, lifeMin: 200, lifeMax: 400,
      color: () => ["#fff", "#ffcc00"][randi(0, 1)], sizeMin: 2, sizeMax: 5, gravity: 0.0004 });
    if (this.hp <= 0) {
      this.dead = true;
      game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 14,
        speedMin: 0.1, speedMax: 0.35, lifeMin: 300, lifeMax: 600,
        color: () => ["#cc0000", "#ff5500", "#fff"][randi(0, 2)], sizeMin: 3, sizeMax: 7, gravity: 0.0005 });
      // drop a coin
      game.coins.push(new Coin(this.x + this.w / 2, this.y, this.mini ? "gold" : "bronze"));
    }
  }
  /**
   * Advances patrol movement (platform-bounded or ground-bounded), gravity and
   * fire-chicken shooting.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (ground, player, projectiles).
   * @returns {void}
   */
  update(dt, game) {
    if (this.flash > 0) this.flash -= dt;
    this.legPhase += dt * 0.01 * Math.abs(this.vx) * 60;
    // simple patrol; turn at platform edges if on a platform
    this.x += this.vx * this.dir * dt;
    if (this.platform) {
      if (this.x < this.platform.x) { this.x = this.platform.x; this.dir = 1; }
      if (this.x + this.w > this.platform.x + this.platform.w) { this.x = this.platform.x + this.platform.w - this.w; this.dir = -1; }
      this.y = this.platform.y - this.h;
    } else {
      // gravity onto ground
      this.vy += GRAVITY * dt; this.y += this.vy * dt;
      const gy = game.groundY - this.h;
      if (this.y >= gy) { this.y = gy; this.vy = 0; }
      if (this.x < 20) { this.x = 20; this.dir = 1; }
      if (this.x + this.w > WORLD_W - 20) { this.x = WORLD_W - 20 - this.w; this.dir = -1; }
    }
    // fire chicken shoots
    if (this.fire) {
      this.shootTimer -= dt;
      if (this.shootTimer <= 0) {
        this.shootTimer = rand(2200, 3800);
        const px = game.player.x + game.player.w / 2;
        const py = game.player.y + game.player.h / 2;
        const ang = Math.atan2(py - (this.y + this.h / 2), px - (this.x + this.w / 2));
        game.projectiles.push(new Projectile(this.x + this.w / 2, this.y + this.h / 2,
          Math.cos(ang) * 0.28, Math.sin(ang) * 0.28, { r: 8, color: "#ff5500", fromBoss: true, life: 3500 }));
        safe(() => Audio.bossShoot(), "chick.shoot");
      }
    }
  }
  /**
   * Draws the chicken (legs, body, head, beak, comb) with a hit flash and
   * fire/mini color variants, facing its travel direction.
   * @param {CanvasRenderingContext2D} ctx - The drawing context.
   * @returns {void}
   */
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.flash > 0) { ctx.globalAlpha = 0.7; }
    const body = this.flash > 0 ? "#ffffff" : (this.fire ? "#ff6633" : (this.mini ? "#ffcc66" : "#f4f4f4"));
    // legs
    ctx.strokeStyle = "#cc8800"; ctx.lineWidth = 3;
    const lp = Math.sin(this.legPhase) * 5;
    ctx.beginPath(); ctx.moveTo(this.w * 0.35, this.h * 0.8); ctx.lineTo(this.w * 0.35 + lp, this.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.w * 0.6, this.h * 0.8); ctx.lineTo(this.w * 0.6 - lp, this.h); ctx.stroke();
    // body
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(this.w / 2, this.h * 0.55, this.w * 0.42, this.h * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(this.w * (this.dir < 0 ? 0.32 : 0.68), this.h * 0.3, this.w * 0.2, 0, Math.PI * 2); ctx.fill();
    // comb
    ctx.fillStyle = "#dd2222";
    ctx.beginPath(); ctx.arc(this.w * (this.dir < 0 ? 0.32 : 0.68), this.h * 0.12, this.w * 0.07, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = "#ffaa00";
    const beakX = this.dir < 0 ? this.w * 0.14 : this.w * 0.86;
    ctx.beginPath(); ctx.moveTo(beakX, this.h * 0.3);
    ctx.lineTo(beakX + this.dir * 8, this.h * 0.34); ctx.lineTo(beakX, this.h * 0.4); ctx.fill();
    // eye
    ctx.fillStyle = this.fire ? "#ffdd00" : "#000";
    ctx.beginPath(); ctx.arc(this.w * (this.dir < 0 ? 0.28 : 0.72), this.h * 0.26, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ----------------------------- Boss ------------------------------------- */
const BOSS_STATE = { IDLE: "IDLE", MOVING: "MOVING", ATTACKING: "ATTACKING", STUNNED: "STUNNED", TRANSITIONING: "TRANSITIONING" };
/**
 * @class Boss
 * @classdesc "El Diablo Pollo" — the multi-phase end boss with melee, slam
 * (shockwave), projectile and meteor attacks, telegraphed weak-point windows,
 * and a health bar.
 * @property {Game} game - Back-reference to the owning game.
 */
class Boss {
  constructor(game) {
    this.game = game;
    this.baseW = 120; this.baseH = 130;
    this.scale = 1;
    this.w = this.baseW; this.h = this.baseH;
    this.x = WORLD_W * 0.7; this.y = game.groundY - this.h;
    this.vx = 0; this.vy = 0;
    this.maxHp = 300; this.hp = 300;
    this.phase = 1;
    this.state = BOSS_STATE.IDLE;
    this.stateTimer = 1500;
    this.attackTimer = 2500;
    this.warnTimer = 0; this.pendingAttack = null;
    this.stun = 0; this.flash = 0;
    this.dir = -1;
    this.rage = 0; this.rageMax = 100;
    this.raging = false; this.rageDuration = 0; this.exhausted = 0;
    this.miniTimer = 15000;
    this.teleportTimer = 4000;
    this.dead = false;
    this.flapPhase = 0;
    this.transitionMsg = ""; this.transitionTime = 0;
    this.dashVx = 0; this.dashing = 0;
    this.eyeGlow = 0;
    // simple learning: track player x histogram
    this.playerHist = {}; this.histTimer = 0;
    this.speed = 0.05;
  }
  /** @returns {boolean} True while the boss is alive. */
  isAlive() { return !this.dead; }
  /** @returns {number} AABB left edge. */
  get bx() { return this.x; }
  /** @returns {number} AABB top edge. */
  get by() { return this.y; }

  /**
   * Rescales the boss about its bottom-center anchor (used on phase growth).
   * @param {number} s - New scale factor relative to the base size.
   * @returns {void}
   */
  applyScale(s) {
    const cx = this.x + this.w / 2, by = this.y + this.h;
    this.scale = s;
    this.w = this.baseW * s; this.h = this.baseH * s;
    this.x = cx - this.w / 2; this.y = by - this.h;
  }
  /**
   * Applies damage: stuns, builds rage, emits debris, checks for a phase
   * transition and triggers death at zero HP. Ignored mid-transition.
   * @param {number} dmg - Damage dealt.
   * @returns {void}
   */
  hurt(dmg) {
    if (this.state === BOSS_STATE.TRANSITIONING) return;
    this.hp -= dmg; this.flash = 140; this.stun = Math.max(this.stun, 300);
    this.state = BOSS_STATE.STUNNED;
    this.rage = clamp(this.rage + 6, 0, this.rageMax);
    safe(() => Audio.bossHit(), "boss.hit");
    this.game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 15,
      speedMin: 0.1, speedMax: 0.4, lifeMin: 300, lifeMax: 600,
      color: () => ["#ff8800", "#ffcc00", "#888"][randi(0, 2)], sizeMin: 3, sizeMax: 8, gravity: 0.0004 });
    this.checkPhase();
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  }
  /**
   * Kills the boss with a large explosion burst and screen shake.
   * @returns {void}
   */
  die() {
    this.dead = true;
    for (let i = 0; i < 60; i++) {
      this.game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 1,
        speedMin: 0.05, speedMax: 0.5, lifeMin: 500, lifeMax: 1400,
        color: () => ["#ff0000", "#ff8800", "#ffcc00", "#fff", "#660000"][randi(0, 4)],
        sizeMin: 3, sizeMax: 10, gravity: 0.0003 });
    }
    Shake.add(800, 10);
  }
  /**
   * Triggers a phase transition when HP crosses the phase thresholds.
   * @returns {void}
   */
  checkPhase() {
    if (this.phase === 1 && this.hp <= 180) this.enterPhase(2);
    else if (this.phase === 2 && this.hp <= 90) this.enterPhase(3);
  }
  /**
   * Enters a new boss phase: shows the taunt, speeds up, (phase 3) grows and
   * raises the music tempo.
   * @param {number} p - The phase to enter (2 or 3).
   * @returns {void}
   */
  enterPhase(p) {
    this.phase = p;
    this.state = BOSS_STATE.TRANSITIONING;
    if (p === 2) {
      this.transitionMsg = "¡ESTOY ENOJADO!";
      this.transitionTime = 1000; this.stateTimer = 1000;
      this.speed *= 1.6; Shake.add(1000, 6);
      safe(() => Audio.bpmMul = 1.4, "boss.bpm2");
    } else if (p === 3) {
      this.transitionMsg = "¡AHORA MUERES!";
      this.transitionTime = 2000; this.stateTimer = 2000;
      this.applyScale(3.5 / 3); // grow from 3x baseline... actually scale baseline is 1 (=3x player). Use 1.17 -> represents extra growth
      this.applyScale(1.17);
      Shake.add(2000, 9);
      safe(() => Audio.bpmMul = 1.8, "boss.bpm3");
      this.game.freeze = 800;
    }
  }
  /**
   * Enters a timed rage state (faster, relentless) once the rage meter fills.
   * @returns {void}
   */
  triggerRage() {
    if (this.raging || this.exhausted > 0) return;
    this.raging = true; this.rageDuration = 3000; this.rage = 0;
    this.state = BOSS_STATE.ATTACKING;
    Shake.add(400, 5);
  }
  /**
   * Picks a random attack from the pool available in the current phase.
   * @returns {number} The chosen attack id.
   */
  chooseAttack() {
    const pool = [1, 2, 3];
    if (this.phase >= 2) pool.push(4, 5, 6);
    if (this.phase >= 3) pool.push(7, 8);
    return pool[randi(0, pool.length - 1)];
  }
  /**
   * Executes the given attack pattern (stomp/shockwave, fireball spreads,
   * meteors, dashes, fire patches, …) by spawning the relevant hazards and
   * projectiles.
   * @param {number} n - The attack id from {@link Boss#chooseAttack}.
   * @returns {void}
   */
  doAttack(n) {
    const g = this.game;
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    const px = g.player.x + g.player.w / 2, py = g.player.y + g.player.h / 2;
    const P = (x, y, vx, vy, o) => g.projectiles.push(new Projectile(x, y, vx, vy, Object.assign({ fromBoss: true }, o)));
    safe(() => Audio.bossShoot(), "boss.atk");
    if (n === 1) { // Stampfen -> jump then shockwave on land
      this.vy = -1.1; this.pendingStomp = true;
    } else if (n === 2) { // 3 fireballs straight with y-tracking
      for (let i = 0; i < 3; i++) setTimeout(() => safe(() => {
        if (this.dead) return;
        const ty = py + rand(-20, 20);
        const ang = Math.atan2(ty - cy, px - cx);
        P(cx, cy, Math.cos(ang) * 0.32, Math.sin(ang) * 0.32, { r: 11, color: "#ff6600" });
      }, "atk2"), i * 220);
    } else if (n === 3) { // 5 feathers diagonal down
      for (let i = 0; i < 5; i++) {
        const a = (-0.7 + i * 0.35);
        P(cx, cy, Math.sin(a) * 0.25, 0.18 + Math.cos(a) * 0.05, { r: 9, feather: true, gravity: 0.0004, life: 4000 });
      }
    } else if (n === 4) { // fire wall arc 60-120
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * (0.33 + i * 0.085); // ~60-120deg downward fan toward player side
        const dirToP = px < cx ? Math.PI - a : a;
        P(cx, cy, Math.cos(dirToP) * 0.3, Math.sin(dirToP) * 0.3 - 0.1, { r: 10, color: "#ff4400" });
      }
    } else if (n === 5) { // dash attack
      this.dashing = 600;
      this.dashVx = (px < cx ? -1 : 1) * 0.9;
      this.teleportBlink = 200;
    } else if (n === 6) { // 3 fire patches
      for (let i = 0; i < 3; i++) {
        const fx = clamp(px - 120 + i * 110, 40, WORLD_W - 120);
        g.hazards.push(new FirePatch(fx, g.groundY - 14, 80));
      }
    } else if (n === 7) { // 360 ring 12
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        P(cx, cy, Math.cos(a) * 0.26, Math.sin(a) * 0.26, { r: 10, color: "#ff3300" });
      }
    } else if (n === 8) { // meteor rain 8
      for (let i = 0; i < 8; i++) g.hazards.push(new Meteor(rand(60, WORLD_W - 60), g.groundY));
    }
  }
  /**
   * Drives the boss state machine each frame: transitions, teleports, attack
   * selection/telegraph/execution, rage, movement, gravity and stun recovery.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game.
   * @returns {void}
   */
  update(dt, game) {
    if (this.dead) return;
    this.flapPhase += dt * 0.01;
    this.eyeGlow = (Math.sin(this.flapPhase * 2) + 1) / 2;
    if (this.flash > 0) this.flash -= dt;

    // learning histogram
    this.histTimer -= dt;
    if (this.histTimer <= 0) {
      this.histTimer = 300;
      const bucket = Math.floor((game.player.x / WORLD_W) * 8);
      this.playerHist[bucket] = (this.playerHist[bucket] || 0) + 1;
    }

    // rage meter fills over time
    if (!this.raging && this.exhausted <= 0 && this.state !== BOSS_STATE.TRANSITIONING) {
      this.rage = clamp(this.rage + dt * 0.004, 0, this.rageMax);
      if (this.rage >= this.rageMax) this.triggerRage();
    }

    if (this.state === BOSS_STATE.TRANSITIONING) {
      this.stateTimer -= dt;
      this.transitionTime -= dt;
      if (this.stateTimer <= 0) { this.state = BOSS_STATE.IDLE; this.stateTimer = 800; }
      return;
    }

    // phase 3 teleport
    if (this.phase === 3 && !this.raging) {
      this.teleportTimer -= dt;
      if (this.teleportTimer <= 0) {
        this.teleportTimer = 4000;
        this.teleportBlink = 250;
        this.x = clamp(rand(80, WORLD_W - 80) - this.w / 2, 20, WORLD_W - this.w - 20);
        game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 16,
          speedMin: 0.1, speedMax: 0.3, lifeMin: 200, lifeMax: 400, color: "#aa00ff",
          sizeMin: 3, sizeMax: 7 });
      }
    }
    if (this.teleportBlink > 0) this.teleportBlink -= dt;

    // mini chickens in phase 2+
    if (this.phase >= 2) {
      this.miniTimer -= dt;
      if (this.miniTimer <= 0) {
        this.miniTimer = 15000;
        for (let i = 0; i < 2; i++) game.enemies.push(new Chicken(rand(100, WORLD_W - 100), game.groundY - 40, { mini: true, speed: 0.1 }));
      }
    }

    // RAGE behavior
    if (this.raging) {
      this.rageDuration -= dt;
      // shoot everywhere
      if (Math.random() < dt / 120) {
        const a = rand(0, Math.PI * 2);
        game.projectiles.push(new Projectile(this.x + this.w / 2, this.y + this.h / 2,
          Math.cos(a) * 0.3, Math.sin(a) * 0.3, { fromBoss: true, r: 9, color: "#ff2200" }));
      }
      this.x += Math.sin(this.flapPhase * 3) * 0.3 * dt;
      this.x = clamp(this.x, 20, WORLD_W - this.w - 20);
      if (this.rageDuration <= 0) { this.raging = false; this.exhausted = 1500; }
      this.applyGravity(dt, game);
      return;
    }
    if (this.exhausted > 0) {
      this.exhausted -= dt;       // schwachstelle - boss vulnerable & still
      this.applyGravity(dt, game);
      return;
    }

    if (this.stun > 0) {
      this.stun -= dt;
      if (this.stun <= 0) this.state = BOSS_STATE.IDLE;
      this.applyGravity(dt, game);
      return;
    }

    // Dash movement
    if (this.dashing > 0) {
      this.dashing -= dt;
      this.x += this.dashVx * dt;
      if (this.x < 20) { this.x = 20; this.dashVx = Math.abs(this.dashVx); }
      if (this.x > WORLD_W - this.w - 20) { this.x = WORLD_W - this.w - 20; this.dashVx = -Math.abs(this.dashVx); }
      this.applyGravity(dt, game);
      if (this.dashing <= 0) this.state = BOSS_STATE.IDLE;
      return;
    }

    // pending stomp
    this.applyGravity(dt, game);

    // warn -> attack
    if (this.warnTimer > 0) {
      this.warnTimer -= dt;
      if (this.warnTimer <= 0) {
        this.state = BOSS_STATE.ATTACKING;
        this.doAttack(this.pendingAttack);
        this.attackTimer = (this.phase >= 2 ? 1600 : 2400) * (this.phase >= 3 ? 0.8 : 1);
        this.state = BOSS_STATE.MOVING;
      }
      return;
    }

    // movement toward player (or away from predicted spot = "learning")
    this.attackTimer -= dt;
    const px = game.player.x + game.player.w / 2;
    const myc = this.x + this.w / 2;
    this.dir = px < myc ? -1 : 1;
    if (this.phase < 3) this.x += this.dir * this.speed * dt;
    this.x = clamp(this.x, 20, WORLD_W - this.w - 20);

    if (this.attackTimer <= 0) {
      this.pendingAttack = this.chooseAttack();
      this.warnTimer = 500;     // 0.5s warn glow
      this.state = BOSS_STATE.ATTACKING;
    }
  }
  /**
   * Applies gravity to the boss and, on landing a stomp, spawns a shockwave.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (ground, hazards).
   * @returns {void}
   */
  applyGravity(dt, game) {
    this.vy += GRAVITY * dt;
    this.y += this.vy * dt;
    const gy = game.groundY - this.h;
    if (this.y >= gy) {
      if (this.pendingStomp && this.vy > 0.3) {
        this.pendingStomp = false;
        game.hazards.push(new Shockwave(this.x + this.w / 2, gy + this.h));
        Shake.add(300, 7);
        safe(() => Audio.explosion(), "boss.stomp");
      }
      this.y = gy; this.vy = 0;
    }
  }
  /**
   * Renders the boss (body, wings, eyes, phase color, rage/exhaust tells and
   * teleport blink) plus its floating taunt during transitions.
   * @param {CanvasRenderingContext2D} ctx - The world-space drawing context.
   * @returns {void}
   */
  draw(ctx) {
    if (this.dead) return;
    ctx.save();
    if (this.teleportBlink > 0 && Math.floor(this.teleportBlink / 60) % 2 === 0) ctx.globalAlpha = 0.4;
    const warnGlow = this.warnTimer > 0;
    const x = this.x, y = this.y, w = this.w, h = this.h;
    // color by phase
    let body, belly;
    if (this.phase === 1) { body = "#a8431f"; belly = "#d98b3a"; }
    else if (this.phase === 2) { body = "#d42020"; belly = "#ff7a3a"; }
    else { body = Math.floor(this.flapPhase * 6) % 2 ? "#2a0000" : "#6a0000"; belly = "#ff3300"; }
    if (this.flash > 0) { body = "#ffffff"; belly = "#ffdddd"; }
    if (this.exhausted > 0) { ctx.globalAlpha = (ctx.globalAlpha || 1) * 0.85; }

    // warn aura
    if (warnGlow) {
      ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(this.warnTimer * 0.05) * 0.3;
      ctx.fillStyle = "#ffff66";
      ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w * 0.7, h * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // phase 3 flame aura
    if (this.phase === 3) {
      ctx.save(); ctx.globalAlpha = 0.3;
      for (let i = 0; i < 6; i++) {
        const a = this.flapPhase + i;
        ctx.fillStyle = i % 2 ? "#ff5500" : "#ffaa00";
        ctx.beginPath();
        ctx.arc(x + w / 2 + Math.cos(a) * w * 0.55, y + h / 2 + Math.sin(a) * h * 0.55, 14, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    // wings (flap)
    const flap = Math.sin(this.flapPhase) * 0.3;
    ctx.fillStyle = body;
    ctx.save(); ctx.translate(x + w * 0.15, y + h * 0.5); ctx.rotate(-0.4 + flap);
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.22, h * 0.32, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(x + w * 0.85, y + h * 0.5); ctx.rotate(0.4 - flap);
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.22, h * 0.32, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // body
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * 0.58, w * 0.4, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    // belly
    ctx.fillStyle = belly;
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * 0.65, w * 0.24, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.28, w * 0.26, 0, Math.PI * 2); ctx.fill();
    // comb (angry spikes)
    ctx.fillStyle = "#cc0000";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + w * (0.4 + i * 0.1), y + h * 0.08);
      ctx.lineTo(x + w * (0.45 + i * 0.1), y - h * 0.04);
      ctx.lineTo(x + w * (0.5 + i * 0.1), y + h * 0.08);
      ctx.fill();
    }
    // eyes (glow)
    const eg = this.phase >= 2 ? this.eyeGlow : 0;
    ctx.fillStyle = this.phase >= 2 ? "#ff" + (Math.floor(60 + eg * 120)).toString(16).padStart(2, "0") + "00" : "#220000";
    ctx.beginPath(); ctx.arc(x + w * 0.4, y + h * 0.26, w * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.6, y + h * 0.26, w * 0.06, 0, Math.PI * 2); ctx.fill();
    // angry brows
    ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + w * 0.32, y + h * 0.18); ctx.lineTo(x + w * 0.46, y + h * 0.24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w * 0.68, y + h * 0.18); ctx.lineTo(x + w * 0.54, y + h * 0.24); ctx.stroke();
    // beak
    ctx.fillStyle = "#ffaa00";
    ctx.beginPath(); ctx.moveTo(x + w * 0.44, y + h * 0.34);
    ctx.lineTo(x + w * 0.5, y + h * 0.44); ctx.lineTo(x + w * 0.56, y + h * 0.34); ctx.fill();
    // legs
    ctx.strokeStyle = "#cc8800"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x + w * 0.42, y + h); ctx.lineTo(x + w * 0.42, y + h + 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w * 0.58, y + h); ctx.lineTo(x + w * 0.58, y + h + 12); ctx.stroke();
    ctx.restore();
  }
}

/* ----------------------------- Player ----------------------------------- */
const PSTATE = { IDLE: "IDLE", RUN: "RUN", JUMP: "JUMP", FALL: "FALL", DASH: "DASH", HURT: "HURT", DEAD: "DEAD" };
/**
 * @class Player
 * @classdesc The controllable hero (Pepe). Handles tuned variable-height
 * jumping, double-jump/air-dash upgrades, stomping, throwing, hearts/shield,
 * invulnerability frames and animation.
 * @property {Game} game - Back-reference to the owning game.
 */
class Player {
  constructor(game) {
    this.game = game;
    this.w = 42; this.h = 56;
    this.x = 120; this.y = game.groundY - this.h;
    this.vx = 0; this.vy = 0;
    this.prevY = this.y;
    this.baseSpeed = 0.46; this.speed = 0.46; this.jumpVel = -1.18;
    this.onGround = false;
    this.facing = 1;
    this.hearts = 3;
    this.invuln = 0;
    this.state = PSTATE.IDLE;
    this.coyote = 0; this.jumpBuffer = 0;
    this.jumpsLeft = 1;
    this.dashCooldown = 0; this.dashTime = 0; this.airDashLeft = 0;
    this.animPhase = 0;
    this.dead = false;
    this.shield = false;
    this.hurtFlash = 0;
  }
  /** @returns {boolean} True while the player is alive. */
  isAlive() { return !this.dead; }
  /** @returns {number} Collision-box left edge (alias of x). */
  get bx() { return this.x; }
  /** @returns {number} Collision-box top edge (alias of y). */
  get by() { return this.y; }

  /**
   * Resets position and transient movement/combat state (used on (re)spawn).
   * @param {number} x - Spawn X in virtual coords.
   * @param {number} y - Spawn Y in virtual coords.
   * @returns {void}
   */
  reset(x, y) {
    this.x = x; this.y = y; this.prevY = y; this.vx = 0; this.vy = 0;
    this.state = PSTATE.IDLE; this.invuln = 0; this.dead = false;
    this.coyote = 0; this.jumpBuffer = 0; this.onGround = false;
  }
  /**
   * Applies purchased upgrades (double jump, air dash, magnet, speed, shield).
   * @param {{doubleJump:boolean,airDash:boolean,magnet:boolean,speed:boolean,shield:boolean}} u - Upgrade flags.
   * @returns {void}
   */
  applyUpgrades(u) {
    this.maxJumps = u.doubleJump ? 2 : 1;
    this.maxAirDash = u.airDash ? 2 : 0;
    this.hasMagnet = !!u.magnet;
    this.speed = u.speed ? this.baseSpeed * 1.3 : this.baseSpeed;
    this.shield = !!u.shield;
  }
  /**
   * Applies damage to the player: consumes a shield if present, otherwise
   * deducts hearts, grants invulnerability frames, applies knockback, breaks
   * the combo, and triggers death at zero hearts.
   * @param {number} [dmg=1] - Damage in hearts.
   * @returns {void}
   */
  takeHit(dmg) {
    if (this.invuln > 0 || this.dead) return;
    if (this.shield) {
      this.shield = false; this.invuln = 1000;
      safe(() => Audio.powerup(), "shield");
      this.game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 12,
        speedMin: 0.1, speedMax: 0.3, lifeMin: 200, lifeMax: 400, color: "#33ccff", sizeMin: 3, sizeMax: 6 });
      return;
    }
    this.hearts -= (dmg || 1);
    this.invuln = 1500; this.hurtFlash = 300;
    this.state = PSTATE.HURT;
    this.vy = -0.4; this.vx = -this.facing * 0.3;
    safe(() => Audio.hurt(), "player.hurt");
    Shake.add(200, 5);
    this.game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 12,
      speedMin: 0.1, speedMax: 0.35, lifeMin: 250, lifeMax: 500, color: () => ["#ff0000", "#cc0000"][randi(0, 1)],
      sizeMin: 3, sizeMax: 6, gravity: 0.0004 });
    this.game.combo.reset(true);
    if (this.hearts <= 0) { this.hearts = 0; this.die(); }
  }
  /**
   * Kills the player once (idempotent), launching the corpse upward. The guard
   * prevents repeated knockback from re-firing each frame.
   * @returns {void}
   */
  die() {
    if (this.dead) return;        // never re-run death (prevents repeated knockback)
    this.dead = true; this.state = PSTATE.DEAD;
    this.onGround = false;
    this.vy = -0.8;
  }
  /**
   * Advances the player one frame: timers, horizontal movement, variable-height
   * jump, dash, gravity, platform/ground collision, coyote time and animation.
   * @param {number} dt - Elapsed time in milliseconds.
   * @param {Game} game - The owning game (for platforms, ground, particles).
   * @returns {void}
   */
  update(dt, game) {
    if (this.hurtFlash > 0) this.hurtFlash -= dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    this.animPhase += dt * 0.01;

    if (this.dead) {
      this.prevY = this.y;
      this.vy += GRAVITY * dt; this.y += this.vy * dt;
      return;
    }

    this.prevY = this.y;                 // position at frame start (for robust collision)
    const wasGround = this.onGround;

    // Horizontal
    let move = 0;
    if (Input.left) move -= 1;
    if (Input.right) move += 1;
    if (move !== 0) this.facing = move;

    if (this.dashTime > 0) {
      this.dashTime -= dt;
      this.vx = this.facing * 1.05;
      this.state = PSTATE.DASH;
      if (Math.random() < 0.6) game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 1,
        speedMin: 0, speedMax: 0.05, lifeMin: 150, lifeMax: 300, color: "#aaddff", sizeMin: 3, sizeMax: 6 });
    } else {
      const target = move * this.speed;
      // dt-correct smoothing: snappy on ground, slightly looser in air
      const rate = (this.onGround ? 0.024 : 0.012);
      const f = 1 - Math.exp(-rate * dt);
      this.vx += (target - this.vx) * f;
      if (Math.abs(this.vx) < 0.004) this.vx = 0;
    }

    // Dash trigger
    if (Input.dashPressed && this.dashCooldown <= 0) {
      let canDash = false;
      if (this.onGround) canDash = true;
      else if (this.airDashLeft > 0) { canDash = true; this.airDashLeft--; }
      if (canDash) {
        this.dashTime = 180; this.dashCooldown = 500;
        this.vy = 0;
        safe(() => Audio.jump(), "dash");
        game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h / 2, count: 8,
          speedMin: 0.1, speedMax: 0.3, lifeMin: 150, lifeMax: 350, color: "#88ddff", sizeMin: 2, sizeMax: 5 });
      }
    }

    // Jump buffering + coyote
    if (Input.jumpPressed) this.jumpBuffer = 100;
    if (this.jumpBuffer > 0) this.jumpBuffer -= dt;
    if (this.coyote > 0) this.coyote -= dt;

    const canJumpGround = this.onGround || this.coyote > 0;
    if (this.jumpBuffer > 0 && (canJumpGround || this.jumpsLeft > 0)) {
      if (canJumpGround) { this.vy = this.jumpVel; this.jumpsLeft = this.maxJumps - 1; this.coyote = 0; }
      else if (this.jumpsLeft > 0) {
        this.vy = this.jumpVel * 0.95; this.jumpsLeft--;
        game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h, count: 8,
          speedMin: 0.06, speedMax: 0.2, lifeMin: 150, lifeMax: 350, color: "#bfe3ff", sizeMin: 2, sizeMax: 5, angle: Math.PI / 2, spread: 1.0 });
      }
      this.jumpBuffer = 0; this.onGround = false;
      safe(() => Audio.jump(), "jump");
      game.particles.emit({ x: this.x + this.w / 2, y: this.y + this.h, count: 5,
        speedMin: 0.05, speedMax: 0.15, lifeMin: 150, lifeMax: 300, color: "#dddddd", sizeMin: 2, sizeMax: 4, angle: Math.PI / 2, spread: 0.6 });
    }

    // gravity — asymmetric for great jump feel + variable height
    let g;
    if (this.vy < 0 && !Input.jump) g = PLAYER_G_CUT;        // released early → short hop
    else if (Math.abs(this.vy) < 0.18) g = PLAYER_G_HANG;     // floaty apex
    else if (this.vy < 0) g = PLAYER_G_UP;
    else g = PLAYER_G_DOWN;
    this.vy += g * dt;
    this.vy = clamp(this.vy, -2.2, 1.9);

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // world bounds
    this.x = clamp(this.x, 0, WORLD_W - this.w);

    // platform + ground collisions
    this.onGround = false;
    // ground
    const gy = game.groundY - this.h;
    // lava floor in level 2/3 handled by game (instakill). Standard ground:
    if (!game.noFloor && this.y >= gy) { this.y = gy; this.vy = 0; this.onGround = true; }

    // land on platform tops only when descending and feet were above the top last frame
    if (this.vy >= 0) {
      const prevBottom = this.prevY + this.h;
      for (const p of game.platforms) {
        const overlapX = this.x + this.w * 0.85 > p.x && this.x + this.w * 0.15 < p.x + p.w;
        if (overlapX && this.y + this.h >= p.y && prevBottom <= p.y + 8) {
          this.y = p.y - this.h; this.vy = 0; this.onGround = true;
          p.triggerFall();
          break;
        }
      }
    }

    if (this.onGround) {
      this.jumpsLeft = this.maxJumps - 1;     // remaining air jumps after the ground jump
      this.airDashLeft = this.maxAirDash;
      this.coyote = 150;
    } else if (wasGround) {
      this.coyote = 150;                      // coyote time after walking off an edge
    }

    // state
    if (this.state !== PSTATE.HURT || this.hurtFlash <= 0) {
      if (this.dashTime > 0) this.state = PSTATE.DASH;
      else if (!this.onGround) this.state = this.vy < 0 ? PSTATE.JUMP : PSTATE.FALL;
      else if (Math.abs(this.vx) > 0.05) this.state = PSTATE.RUN;
      else this.state = PSTATE.IDLE;
    }

    // fall death
    if (this.y > WORLD_H + 100) { this.hearts = 0; this.die(); }
  }
  /**
   * Renders the player sprite for the current state (idle/run/jump/dash/hurt/
   * dead), including invulnerability blink, shield aura and facing flip.
   * @param {CanvasRenderingContext2D} ctx - The world-space drawing context.
   * @returns {void}
   */
  draw(ctx) {
    ctx.save();
    // invuln blink
    if (this.invuln > 0 && Math.floor(this.invuln / 80) % 2 === 0) ctx.globalAlpha = 0.4;
    const x = this.x, y = this.y, w = this.w, h = this.h;
    const run = this.state === PSTATE.RUN;
    const legSwing = run ? Math.sin(this.animPhase * 2) * 8 : 0;
    let bodyCol = "#3a6ea5";
    if (this.state === PSTATE.HURT && Math.floor(this.hurtFlash / 60) % 2 === 0) bodyCol = "#ff5555";
    // shield aura
    if (this.shield) {
      ctx.save(); ctx.globalAlpha = 0.3 + Math.sin(this.animPhase * 2) * 0.1;
      ctx.strokeStyle = "#33ccff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w * 0.8, h * 0.65, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x + w / 2, y);
    ctx.scale(this.facing, 1);
    ctx.translate(-w / 2, 0);
    // legs
    ctx.strokeStyle = "#222"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(w * 0.4, h * 0.7); ctx.lineTo(w * 0.4 - legSwing * 0.05 - 3, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.6, h * 0.7); ctx.lineTo(w * 0.6 + legSwing * 0.05 + 3, h); ctx.stroke();
    // body (poncho)
    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.25);
    ctx.lineTo(w * 0.15, h * 0.72);
    ctx.lineTo(w * 0.85, h * 0.72);
    ctx.closePath(); ctx.fill();
    // stripe
    ctx.fillStyle = "#e8c84a";
    ctx.fillRect(w * 0.2, h * 0.6, w * 0.6, 4);
    // head
    ctx.fillStyle = "#f0c89a";
    ctx.beginPath(); ctx.arc(w * 0.5, h * 0.2, w * 0.22, 0, Math.PI * 2); ctx.fill();
    // sombrero
    ctx.fillStyle = "#b8860b";
    ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.1, w * 0.4, h * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.04, w * 0.18, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    // eye
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(w * 0.58, h * 0.2, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}

/* ----------------------------- Combo ------------------------------------ */
/**
 * @class Combo
 * @classdesc Tracks the player's kill/collect streak within a rolling time
 * window to award escalating score multipliers and flash feedback.
 */
class Combo {
  constructor(game) { this.game = game; this.streak = 0; this.timer = 0; this.window = 2000; this.flash = 0; }
  get multiplier() {
    if (this.streak >= 20) return 3;
    if (this.streak >= 10) return 2;
    if (this.streak >= 5) return 1.5;
    return 1;
  }
  /**
   * Increments the streak, refreshes the decay timer, and spawns a rainbow coin
   * at the x3 milestone.
   * @returns {void}
   */
  add() {
    const prevMult = this.multiplier;
    this.streak++;
    this.timer = this.window;
    safe(() => Audio.combo(), "combo");
    // rainbow spawn on hitting x3 (>=20)
    if (this.streak === 20) {
      this.game.spawnRainbow();
    }
  }
  /**
   * Resets the streak, playing a break sound/flash if a meaningful streak was
   * lost.
   * @param {boolean} [broken] - True when the streak was broken (timeout/hit).
   * @returns {void}
   */
  reset(broken) {
    if (broken && this.streak >= 5) {
      this.flash = 200;
      safe(() => Audio.comboBreak(), "comboBreak");
    }
    this.streak = 0; this.timer = 0;
  }
  /**
   * Ticks the flash and decay timers, breaking the combo when it lapses.
   * @param {number} dt - Elapsed time in milliseconds.
   * @returns {void}
   */
  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (this.timer > 0) {
      this.timer -= dt;
      if (this.timer <= 0) this.reset(true);
    }
  }
}
